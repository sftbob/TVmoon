name: Upstream Sync
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin sync/upstream; then
            git fetch origin sync/upstream:refs/remotes/origin/sync/upstream
            git switch -c sync/upstream origin/sync/upstream
            git merge --no-edit origin/main
          else
            git switch -c sync/upstream origin/main
          fi
          git remote add upstream https://github.com/senshinya/MoonTV.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main
      - name: Merge with safety guards
        run: node scripts/safe-upstream-merge.cjs
      - name: Push only sync branch and open draft PR
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/sync/upstream
          if git diff --quiet origin/main HEAD; then exit 0; fi
          existing=$(gh pr list --base main --head sync/upstream --state open --json number --jq 'length')
          if [ "$existing" = 0 ]; then
            gh pr create --base main --head sync/upstream --draft --title 'Review upstream updates' --body 'Approve CI execution if requested after review. Merge only after required checks and manual site smoke checks pass. Use a merge commit; do not enable auto-merge.'
          fi
